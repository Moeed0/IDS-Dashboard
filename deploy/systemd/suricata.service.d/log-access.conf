# Suricata's new log and pcap files: root may write them, its group read
# them, and no one else (the default ACL that
# deploy/apply-suricata-settings.sh puts on /var/log/suricata lets the
# dashboard's user read them too). Installed in
# /etc/systemd/system/suricata.service.d/ by that script.
[Service]
UMask=0027
