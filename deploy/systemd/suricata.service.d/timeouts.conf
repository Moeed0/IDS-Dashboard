# Time for Suricata to start and stop. It loads about 69,500 rules: about
# 30 s with its compiled pattern cache, but nearly 2 minutes when a rule
# change means building that cache again, more when memory is short. The
# default 90 s had systemd kill it mid-load on 27 Nov 2026 (and once more
# on the retry), leaving 7 minutes without capture. Installed in
# /etc/systemd/system/suricata.service.d/ by deploy/apply-suricata-settings.sh.
[Service]
TimeoutStartSec=5min
TimeoutStopSec=3min
