# Snort reads packets with afpacket, which hands each one over as it
# arrives, so alerts are written within a second. The default pcap DAQ
# waited for 64 packets, which on a quiet network held alerts for minutes.
# This replaces the ExecStart of snort-lab.service: change Snort's command
# here. --plugin-path: the compiled shared-object (SO) rules, which only load
# from the command line (deploy/update-rules.sh puts them there).
[Service]
ExecStart=
ExecStart=/usr/local/bin/snort -c /usr/local/etc/snort/snort.lua --plugin-path /usr/local/lib/snort/so_rules -i ens38 --daq afpacket -A alert_json -l /var/log/snort
