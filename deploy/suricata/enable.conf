# suricata-update enable.conf, installed as /etc/suricata/enable.conf.
#
# Enable every rule that the ET Open ruleset ships disabled, for the most
# alerts (2026-10-28). suricata-update applies disable rules before enable
# rules, so the 18 rules that cannot load on this sensor are left out here:
#   28, 29, 30           example file-hash rules that need a hash list file
#   2250001-2250009      Modbus event rules (the Modbus parser is off)
#   2270000-2270006      DNP3 event rules (the DNP3 parser is off)
#   2009205-2009207      ET's Conficker P2P rules, turned off on the user's word
#                        (12 Nov 2026; see disable.conf)
re:^(?!.*\bsid:\s*(28|29|30|225000[1-9]|227000[0-6]|200920[567])\s*;).
