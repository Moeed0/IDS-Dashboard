# suricata-update: changes made to the rules on every update. Installed as
# /etc/suricata/modify.conf (see deploy/README.md).
#
# Log every match: remove the threshold option (type limit, threshold or
# both), which logs a rule at most once per period, or only every Nth
# match. [^;"] keeps the match out of a msg string. Helper rules marked
# noalert, and rules with detection_filter (alert only after N matches),
# stay as they are.
re:threshold: "\bthreshold:\s*[^;\"]*;\s*" ""

# Seven ET rules say "not one of my servers" (!$HOME_NET, !$SQL_SERVERS,
# ![$DNS_SERVERS,$SMTP_SERVERS] ...). With HOME_NET "any" (and the server
# lists, which are HOME_NET) that is "not any", which Suricata refuses to
# load. Each such address becomes $EXTERNAL_NET, as ET writes "outside" in
# its other rules; in this lab it is "any" too. The rules then load and can
# fire; nothing else changes.
1:2000328,1:2001689,1:2002087,1:2003195,1:2003330,1:2003864,1:2011802 "!([$][A-Z_]+|\[[$][A-Z_]+,\s*[$][A-Z_]+\])" "$EXTERNAL_NET"
